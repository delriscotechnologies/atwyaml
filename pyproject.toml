[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atwyaml"
version = "0.2.0"
description = "Prepare adversarial YAML tasks and review manual agent captures offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
atwyaml = "atwyaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
