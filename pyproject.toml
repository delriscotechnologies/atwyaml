[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atwyaml"
version = "0.1.0"
description = "Author and score YAML prompt-injection tasks from chat-box captures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
atwyaml = "atwyaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
